services:
  # 1. HepaTwin Python FastAPI Backend Microservice
  - type: web
    name: hepatwin-api
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: CORS_ORIGINS
        value: "*"

  # 2. HepaTwin React 18 Clinical Workstation Frontend
  - type: web
    name: hepatwin-app
    env: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
